<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ListenNow — תמיד יהיה לך משהו מעניין לשמוע</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15121f;
    --surface:#1f1b2e;
    --surface-2:#292440;
    --surface-3:#322c52;
    --accent:#9b6bff;
    --accent-dim:#7c52d9;
    --accent-2:#2dd4da;
    --text:#f1eef9;
    --text-dim:#a9a6bd;
    --text-faint:#6b6785;
    --danger:#fb7185;
    --like:#6fcf97;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Heebo',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.headline{font-family:'Rubik',sans-serif;}
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    padding-bottom:88px;
    background:
      radial-gradient(140% 90% at 50% -10%, #1e2130 0%, var(--bg) 55%);
  }
  ::-webkit-scrollbar{width:0;height:0;}

  /* ---------- home sky background (test) ---------- */
  .sky-bg{position:absolute;top:0;left:0;right:0;height:300px;overflow:hidden;z-index:0;}
  .sky-bg svg{width:100%;height:100%;display:block;}
  .sky-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom, rgba(10,6,20,.55) 0%, rgba(10,6,20,.4) 30%, rgba(10,6,20,.3) 55%, rgba(10,6,20,.12) 78%, var(--bg) 92%);}
  .page-content{position:relative;z-index:1;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 20px 6px;
  }
  .brand{display:flex;align-items:center;gap:8px;font-family:'Rubik',sans-serif;font-weight:700;font-size:19px;letter-spacing:.2px;text-shadow:0 1px 8px rgba(0,0,0,.5);}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
  .brand-sub{font-size:12px;color:var(--text-dim);margin-top:1px;text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .hero-chip{display:inline-block;background:rgba(8,5,16,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:4px 12px;border-radius:8px;text-shadow:0 1px 8px rgba(0,0,0,.6);}

  /* ---------- sections ---------- */
  .screen{padding:4px 20px 28px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .section-title{
    font-family:'Rubik',sans-serif;font-weight:700;font-size:21px;
    margin:22px 0 12px;line-height:1.35;text-shadow:0 1px 8px rgba(0,0,0,.35);
  }
  .section-sub{color:var(--text-dim);font-size:14px;margin:-8px 0 16px;line-height:1.6;text-shadow:0 1px 6px rgba(0,0,0,.35);}

  /* ---------- time chips ---------- */
  .time-row{display:flex;gap:8px;overflow-x:auto;margin:14px 0 6px;padding-bottom:2px;}
  .time-chip{
    flex:0 0 auto;border:1px solid var(--surface-3);background:var(--surface);
    color:var(--text);padding:10px 16px;border-radius:100px;font-size:14px;font-weight:600;
    font-family:'Heebo',sans-serif;cursor:pointer;transition:.15s;
  }
  .time-chip.active{background:var(--accent);border-color:var(--accent);color:#1a1305;}

  /* ---------- hero recommendation ---------- */
  .hero-card{
    margin-top:16px;border-radius:var(--radius-lg);
    background:linear-gradient(150deg,var(--surface-2) 0%,var(--surface) 65%);
    border:1px solid var(--surface-3);
    padding:18px;position:relative;overflow:hidden;
  }
  .hero-card:before{
    content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:140px;height:140px;
    background:radial-gradient(circle,rgba(155,107,255,.28),transparent 70%);
  }
  .hero-eyebrow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .content-card{
    background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--radius-md);
    padding:14px;margin-bottom:10px;position:relative;
  }
  .content-card.compact{padding:12px 14px;}
  .card-cat-bar{position:absolute;top:12px;bottom:12px;inset-inline-start:0;width:4px;border-radius:4px;}
  .card-row{display:flex;gap:12px;align-items:flex-start;}
  .card-icon{
    width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:20px;flex:0 0 44px;
  }
  .card-body{flex:1;min-width:0;}
  .card-title{font-weight:700;font-size:15px;line-height:1.4;margin:0 0 4px;}
  .card-meta{font-size:12px;color:var(--text-dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .card-meta .sep{color:var(--text-faint);}
  .card-reason{
    margin-top:9px;font-size:12.5px;color:var(--text-dim);background:var(--surface-2);
    border-radius:var(--radius-sm);padding:8px 10px;line-height:1.5;
  }
  .card-reason b{color:var(--accent-2);font-weight:600;}
  .card-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}

  .btn{
    border:none;border-radius:100px;padding:9px 16px;font-size:13.5px;font-weight:700;
    font-family:'Heebo',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;
  }
  .btn-primary{background:var(--accent);color:#1a1305;}
  .btn-primary:active{transform:scale(.97);}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--surface-3);}
  .btn-icon{
    background:var(--surface-2);color:var(--text-dim);width:36px;height:36px;border-radius:50%;
    padding:0;display:flex;align-items:center;justify-content:center;font-size:15px;border:1px solid var(--surface-3);
  }
  .btn-icon.liked{background:rgba(111,207,151,.18);color:var(--like);border-color:transparent;}
  .btn-icon.disliked{background:rgba(251,113,133,.18);color:var(--danger);border-color:transparent;}
  .btn-block{width:100%;justify-content:center;padding:13px;font-size:15px;border-radius:var(--radius-md);}

  .badge{
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:100px;background:var(--surface-3);color:var(--text-dim);
  }
  .badge.new{background:rgba(45,212,218,.15);color:var(--accent-2);}
  .badge.heard{background:var(--surface-3);color:var(--text-faint);}

  /* ---------- category groups ---------- */
  .cat-group{margin-bottom:22px;}
  .cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cat-head-left{display:flex;align-items:center;gap:8px;font-family:'Rubik',sans-serif;font-weight:700;font-size:16px;}
  .cat-count{font-size:12px;color:var(--text-faint);font-family:'Heebo',sans-serif;font-weight:500;}

  /* ---------- interests ---------- */
  .interest-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;}
  .interest-chip{
    padding:10px 15px;border-radius:100px;background:var(--surface);border:1.5px solid var(--surface-3);
    font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .interest-chip.selected{background:rgba(155,107,255,.14);border-color:var(--accent);color:var(--accent);}
  .weight-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--surface-2);}
  .weight-label{flex:0 0 96px;font-size:13px;font-weight:600;}
  .weight-bar-track{flex:1;height:7px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
  .weight-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent-dim),var(--accent));}
  .weight-val{font-size:11px;color:var(--text-faint);flex:0 0 30px;text-align:left;}

  /* ---------- playlist ---------- */
  .playlist-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--surface-2);}
  .pl-num{
    width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--text-dim);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 24px;
  }
  .pl-info{flex:1;min-width:0;}
  .pl-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pl-meta{font-size:11.5px;color:var(--text-faint);}
  .pl-total{
    display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;
    border-top:1px dashed var(--surface-3);font-size:14px;font-weight:700;
  }

  /* ---------- history ---------- */
  .hist-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--surface-2);align-items:flex-start;}
  .progress-track{height:5px;border-radius:6px;background:var(--surface-3);margin-top:7px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent-2);border-radius:6px;}

  /* ---------- empty state ---------- */
  .empty{text-align:center;padding:44px 20px;color:var(--text-dim);}
  .empty .em-emoji{font-size:34px;margin-bottom:10px;}
  .empty .em-title{font-weight:700;color:var(--text);margin-bottom:5px;font-family:'Rubik',sans-serif;}
  .empty .em-sub{font-size:13px;line-height:1.6;}

  /* ---------- nav ---------- */
  .navbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:rgba(27,29,41,.92);backdrop-filter:blur(14px);border-top:1px solid var(--surface-3);
    display:flex;justify-content:space-around;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:40;
  }
  .nav-btn{
    background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;
    gap:3px;font-size:10.5px;font-family:'Heebo',sans-serif;font-weight:600;cursor:pointer;padding:4px 10px;
    border-radius:12px;position:relative;
  }
  .nav-btn .nav-emoji{font-size:19px;}
  .nav-btn.active{color:var(--accent);}
  .nav-badge{
    position:absolute;top:-2px;inset-inline-end:0px;background:var(--accent-2);color:#0a1a17;
    font-size:9px;font-weight:800;border-radius:100px;min-width:15px;height:15px;display:flex;
    align-items:center;justify-content:center;padding:0 3px;
  }

  /* ---------- player overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,9,13,.72);z-index:100;display:flex;align-items:flex-end;
    justify-content:center;animation:fadeBg .2s ease;
  }
  @keyframes fadeBg{from{opacity:0}to{opacity:1}}
  .player-sheet{
    width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;padding:22px 22px 30px;
    animation:slideUp .25s cubic-bezier(.2,.8,.3,1);border:1px solid var(--surface-3);border-bottom:none;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .player-art{
    width:100%;aspect-ratio:2.2/1;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:44px;margin-bottom:16px;background:linear-gradient(135deg,var(--surface-3),var(--surface-2));
  }
  .player-title{font-family:'Rubik',sans-serif;font-weight:700;font-size:18px;line-height:1.4;margin-bottom:4px;}
  .player-meta{font-size:13px;color:var(--text-dim);margin-bottom:16px;}
  .player-progress-track{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-bottom:6px;}
  .player-progress-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s linear;}
  .player-times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-faint);margin-bottom:20px;}
  .player-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px;}
  .player-play-btn{
    width:60px;height:60px;border-radius:50%;background:var(--accent);border:none;font-size:22px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1a1305;
  }
  .player-side-btn{
    width:44px;height:44px;border-radius:50%;background:var(--surface-2);border:1px solid var(--surface-3);
    font-size:16px;color:var(--text-dim);cursor:pointer;
  }
  .player-actions{display:flex;gap:8px;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--surface-3);color:var(--text);
    padding:11px 18px;border-radius:100px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);
    display:flex;align-items:center;gap:8px;animation:toastIn .25s ease;max-width:88%;text-align:center;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  .onboard-wrap{padding:60px 24px 40px;text-align:center;}
  .onboard-logo{font-size:46px;margin-bottom:14px;}
  .onboard-tag{font-family:'Rubik',sans-serif;font-weight:700;font-size:26px;line-height:1.4;margin-bottom:10px;}
  .onboard-sub{color:var(--text-dim);font-size:14.5px;line-height:1.6;margin-bottom:34px;}

  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--surface-2);}
  .settings-row-title{font-weight:600;font-size:14.5px;}
  .settings-row-sub{font-size:12px;color:var(--text-faint);margin-top:2px;}
</style>
</head>
<body>
<div id="app"></div>

/* =========================================================================================
   MODULE: CONTENT SOURCES (real) — talks to the ContentSources backend built earlier.
   The frontend never calls YouTube/RSS/etc. directly; it only ever fetches this one
   endpoint. Change API_BASE_URL if the backend runs somewhere other than localhost:3000.
   ========================================================================================= */
const API_BASE_URL = "https://listennow.onrender.com";

function normalizeRemoteItems(items){
  // Backend items only carry content facts (see contentItem.schema.js) —
  // per-user consumption state is always added fresh on the client.
  return items.map(it => ({
    status: "not_started", progress: 0, userRating: null, heardDaysAgo: null,
    ...it
  }));
}

async function loadRemoteCatalog(){
  try {
    const res = await fetch(`${API_BASE_URL}/api/content/catalog`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if(!Array.isArray(data.items) || data.items.length === 0) throw new Error("empty catalog");

    CONTENT_SEED = normalizeRemoteItems(data.items);
    UserPreferences.init(); // recompute weights for the new dataset, keeps chosen interests
    state.playlist = null;
    state.budget = undefined;
    showToast(data.usedMockFallback
      ? "🔌 מחובר לשרת — מציג נתוני Fallback (אין YouTube API key מוגדר)"
      : "🔌 מחובר בהצלחה — מציג תוכן אמיתי מ-YouTube");
    render();
  } catch (err) {
    // Backend not running / unreachable / CORS issue — stay on local
    // fallback data silently. This keeps the prototype fully usable
    // standalone, exactly like before this change.
    console.warn("[ListenNow] Could not reach backend, staying on local demo data:", err.message);
  }
}

/* =========================================================================================
   MODULE: USER PREFERENCES
   ========================================================================================= */
const ALL_INTERESTS = [
  "AI וטכנולוגיה","כדורגל","ספורט","עסקים","יזמות","חדשות",
  "רכבים","כלכלה","מדע","בריאות","בידור","פודקאסטים","YouTube"
];

const UserPreferences = {
  interests: ["AI וטכנולוגיה","כדורגל","עסקים","רכבים"],
  categoryWeights: {},
  init(){
    ALL_INTERESTS.forEach(cat => {
      this.categoryWeights[cat] = this.interests.includes(cat) ? 1.0 : 0.5;
    });
  },
  toggleInterest(cat){
    if(this.interests.includes(cat)){
      this.interests = this.interests.filter(c => c !== cat);
      this.categoryWeights[cat] = Math.min(this.categoryWeights[cat], 0.5);
    } else {
      this.interests.push(cat);
      this.categoryWeights[cat] = Math.max(this.categoryWeights[cat], 1.0);
    }
  },
  addCustomInterest(name){
    if(!name) return;
    if(!ALL_INTERESTS.includes(name)) ALL_INTERESTS.push(name);
    if(!this.categoryWeights[name]) this.categoryWeights[name] = 1.0;
    if(!this.interests.includes(name)) this.interests.push(name);
  },
  reactTo(category, action){
    // action: 'liked' | 'disliked' | 'skipped'
    const w = this.categoryWeights[category] ?? 0.5;
    if(action === "liked") this.categoryWeights[category] = Math.min(1.6, w + 0.2);
    if(action === "disliked") this.categoryWeights[category] = Math.max(0.1, w - 0.25);
    if(action === "skipped") this.categoryWeights[category] = Math.max(0.15, w - 0.05);
  }
};
UserPreferences.init();

/* =========================================================================================
   MODULE: CONSUMPTION HISTORY — tracks per-item state, drives the "never repeat heard
   content" rule.
   ========================================================================================= */
const ConsumptionHistory = {
  isHeard(item){
    return item.status === "completed" && !item.rewatchRequested;
  },
  markStarted(item){
    if(item.status === "not_started") item.status = "started";
  },
  markProgress(item, pct){
    item.progress = pct;
    if(pct >= 95){
      item.status = "completed";
      item.rewatchRequested = false;
      item.heardDaysAgo = 0;
    } else if(pct > 0){
      item.status = "partial";
    }
  },
  markSkipped(item){
    item.status = "skipped";
    UserPreferences.reactTo(item.category, "skipped");
  },
  requestRewatch(item){
    item.rewatchRequested = true;
  },
  rate(item, rating){
    item.userRating = item.userRating === rating ? null : rating;
    if(item.userRating) UserPreferences.reactTo(item.category, item.userRating);
  },
  heardItems(){
    return CONTENT_SEED.filter(it => it.status === "completed" || it.status === "partial")
      .sort((a,b) => (a.heardDaysAgo ?? 0) - (b.heardDaysAgo ?? 0));
  }
};

/* =========================================================================================
   MODULE: RECOMMENDATION ENGINE
   score = interestMatch*.35 + freshness*.2 + popularity*.15 + durationMatch*.15 + rating*.15
   Hard filters: never show items already HEARD (unless rewatch requested).
   ========================================================================================= */
const RecommendationEngine = {
  freshnessScore(item){
    const hours = (nowTs - new Date(item.publishedAt).getTime()) / HOUR;
    return Math.max(0, 1 - hours / (24*7));
  },
  durationScore(item, budgetMinutes){
    if(!budgetMinutes) return 0.7;
    const d = item.duration;
    if(d <= budgetMinutes) return 1 - Math.min(0.3, (budgetMinutes - d) / budgetMinutes * 0.3);
    return Math.max(0, 1 - (d - budgetMinutes) / budgetMinutes);
  },
  score(item, budgetMinutes){
    const interestMatch = UserPreferences.categoryWeights[item.category] ?? 0.5;
    const fresh = this.freshnessScore(item);
    const pop = item.popularity ?? 0.5;
    const dur = this.durationScore(item, budgetMinutes);
    let ratingBoost = 0;
    if(item.userRating === "liked") ratingBoost = 0.3;
    if(item.userRating === "disliked") ratingBoost = -0.6;
    const raw = interestMatch*.35 + fresh*.2 + pop*.15 + dur*.15 + (ratingBoost+0.3)*.15;
    return Math.max(0, raw) * 100;
  },
  eligible(){
    return CONTENT_SEED.filter(it => !ConsumptionHistory.isHeard(it));
  },
  recommendations(budgetMinutes, limit=50){
    return this.eligible()
      .map(it => ({ item: it, score: this.score(it, budgetMinutes) }))
      .sort((a,b) => b.score - a.score)
      .slice(0, limit);
  },
  topPick(budgetMinutes){
    return this.recommendations(budgetMinutes, 1)[0];
  },
  isNew(item){
    const hours = (nowTs - new Date(item.publishedAt).getTime()) / HOUR;
    return hours <= 48 && item.status === "not_started";
  },
  whatsNew(){
    return this.eligible().filter(it => this.isNew(it));
  },
  surpriseMe(){
    // pick something fresh & popular from a category the user did NOT explicitly pick
    const pool = this.eligible().filter(it => !UserPreferences.interests.includes(it.category));
    if(pool.length === 0) return this.recommendations(null, 1)[0];
    const scored = pool.map(it => ({item:it, score: this.freshnessScore(it)*.5 + (it.popularity??.5)*.5}))
      .sort((a,b)=>b.score-a.score);
    return {item: scored[0].item, score: this.score(scored[0].item, null)};
  },
  buildPlaylist(budgetMinutes){
    if(!budgetMinutes) budgetMinutes = 30;
    const ranked = this.recommendations(budgetMinutes, 30);
    const playlist = [];
    let total = 0;
    for(const {item} of ranked){
      if(total + item.duration <= budgetMinutes + Math.max(4, budgetMinutes*0.15)){
        playlist.push(item);
        total += item.duration;
      }
      if(total >= budgetMinutes * 0.85) break;
    }
    if(playlist.length === 0 && ranked[0]) playlist.push(ranked[0].item);
    return { items: playlist, totalMinutes: playlist.reduce((s,i)=>s+i.duration,0) };
  }
};

function setScreen(s){ state.screen = s; render(); window.scrollTo(0,0); }
function showToast(msg){
  state.toast = msg; render();
  setTimeout(()=>{ state.toast = null; render(); }, 2200);
}

function fmtDuration(min){ return min >= 60 ? `${Math.floor(min/60)} שעה ${min%60?('ו-'+(min%60)+' דק׳'):''}` : `${min} דק׳`; }
function fmtHoursAgo(item){
  const h = Math.round((nowTs - new Date(item.publishedAt).getTime())/HOUR);
  if(h < 1) return "לפני פחות משעה";
  if(h < 24) return `לפני ${h} שעות`;
  const d = Math.round(h/24);
  return `לפני ${d} ${d===1?'יום':'ימים'}`;
}
function reasonFor(item){
  const inInterest = UserPreferences.interests.includes(item.category);
  const fresh = RecommendationEngine.freshnessScore(item) > 0.7;
  if(inInterest && fresh) return `אתה עוקב אחרי <b>${item.category}</b>, וזה פורסם ${fmtHoursAgo(item).replace('לפני ','לפני ')}.`;
  if(inInterest) return `זה בתחום <b>${item.category}</b> שמעניין אותך.`;
  if(item.userRating === "liked") return `בעבר סימנת ❤️ על תוכן דומה בתחום <b>${item.category}</b>.`;
  return `לפי מה שאתה אוהב, חשבנו שזה יכול לעניין אותך.`;
}

/* ---------- content card renderer ---------- */
function renderContentCard(item, opts={}){
  const color = CATEGORY_COLORS[item.category] || "#888";
  const icon = CATEGORY_ICONS[item.category] || "🎧";
  const srcIcon = SOURCE_ICONS[item.source] || "🎧";
  const showReason = opts.reason;
  const heard = item.status === "completed";
  return `
  <div class="content-card ${opts.compact?'compact':''}">
    <div class="card-cat-bar" style="background:${color}"></div>
    <div class="card-row">
      <div class="card-icon" style="background:${color}22;color:${color}">${icon}</div>
      <div class="card-body">
        <p class="card-title">${item.title}</p>
        <div class="card-meta">
          <span>${srcIcon} ${item.source}</span><span class="sep">·</span>
          <span>${fmtDuration(item.duration)}</span><span class="sep">·</span>
          <span>${fmtHoursAgo(item)}</span>
          ${heard ? '<span class="badge heard">כבר שמעת</span>' : ''}
          ${RecommendationEngine.isNew(item) ? '<span class="badge new">חדש</span>' : ''}
        </div>
        ${showReason ? `<div class="card-reason">💡 ${reasonFor(item)}</div>` : ''}
        <div class="card-actions">
          <button class="btn btn-primary" onclick="openPlayer(${item.id})">▶️ ${heard?'שמע שוב':'האזן עכשיו'}</button>
          <button class="btn-icon ${item.userRating==='liked'?'liked':''}" onclick="rateItem(${item.id},'liked')" title="מעניין אותי">❤️</button>
          <button class="btn-icon ${item.userRating==='disliked'?'disliked':''}" onclick="rateItem(${item.id},'disliked')" title="פחות מעניין">👎</button>
          <button class="btn-icon" onclick="skipItem(${item.id})" title="דלג">⏭️</button>
        </div>
      </div>
    </div>
  </div>`;
}

        <span class="badge">v0.1</span>
      </div>
    </div>

    <h2 class="section-title" style="font-size:16px;">מקורות תוכן (עתידיים)</h2>
    <div class="content-card" style="padding:4px 14px;">
      ${Object.entries(ContentSources.descriptions).map(([src,desc]) => `
        <div class="settings-row">
          <div><div class="settings-row-title">${SOURCE_ICONS[src]||'🔹'} ${src}</div><div class="settings-row-sub">${desc}</div></div>
        </div>`).join("")}
    </div>
  </div>`;
}
function resetDemo(){
  location.reload();
}

function emptyState(emoji,title,sub){
  return `<div class="empty"><div class="em-emoji">${emoji}</div><div class="em-title">${title}</div><div class="em-sub">${sub}</div></div>`;
}

/* ---------- item actions ---------- */
function rateItem(id, rating){
  const item = CONTENT_SEED.find(i=>i.id===id);
  ConsumptionHistory.rate(item, rating);
  showToast(rating==='liked' ? "❤️ נרשם — נעדיף תוכן דומה" : "👎 נרשם — נראה פחות תוכן כזה");
}
function skipItem(id){
  const item = CONTENT_SEED.find(i=>i.id===id);
  ConsumptionHistory.markSkipped(item);
  showToast("⏭️ דילגנו — נזכור את זה");
  render();
}

/* ---------- player ---------- */
function openPlayer(id, isSurprise, fromPlaylist){
  const item = CONTENT_SEED.find(i=>i.id===id);
  ConsumptionHistory.markStarted(item);
  state.player = item;
  state.playerProgress = item.progress && item.progress < 95 ? item.progress : 0;
  state.playerIsSurprise = !!isSurprise;
  // Explicit flag for "is this player session actually part of an
  // active playlist run" — NOT inferred from whether this item's id
  // happens to also appear in state.playlist.items, which caused
  // false positives (e.g. "Surprise me" picking an item that
  // coincidentally overlapped with an old playlist, silently
  // auto-chaining into it on completion).
  state.playerFromPlaylist = !!fromPlaylist;
  state.playerPlaying = true;
  render();
  runPlayerTick();
}
function runPlayerTick(){
  clearInterval(state.playerTimer);
  state.playerTimer = setInterval(() => {
    if(!state.player || !state.playerPlaying) return;
    state.playerProgress = Math.min(100, state.playerProgress + 4);
    ConsumptionHistory.markProgress(state.player, state.playerProgress);
    if(state.playerProgress >= 100){
      clearInterval(state.playerTimer);
      finishPlayer();
      return;
    }
    renderPlayerOnly();
  }, 250);
}
function togglePlay(){
  state.playerPlaying = !state.playerPlaying;
  render();
}
function finishPlayer(){
  const item = state.player;
  closePlayer(true); // natural completion — auto-advance if this was a playlist item
  showToast(`✅ "${item.title}" הושלם — לא יומלץ שוב`);
}
function skipInPlayer(){
  ConsumptionHistory.markSkipped(state.player);
  closePlayer(false); // user chose to skip and exit — don't auto-chain into the playlist
  showToast("⏭️ דילגת — נזכור את זה");
}
function closePlayer(shouldAdvance){
  clearInterval(state.playerTimer);
  const wasFromPlaylist = state.playerFromPlaylist;
  state.player = null;
  if(shouldAdvance && wasFromPlaylist && state.playlistActive){
    advancePlaylist();
  } else {
    // Any manual close (✕/סגור button, clicking outside the player)
    // ends playlist auto-advance mode — otherwise it stays stuck "on"
    // and silently chain-plays the next playlist item the next time
    // ANY unrelated card is opened and finished, which looks like a
    // runaway open/close loop.
    state.playlistActive = false;
    render();
  }
}
function startPlaylist(){
  if(!state.playlist || state.playlist.items.length===0) return;
  state.playlistActive = true;
  state.playlistIndex = 0;
  openPlayer(state.playlist.items[0].id, false, true);
}
function advancePlaylist(){
  state.playlistIndex++;
  if(state.playlist && state.playlistIndex < state.playlist.items.length){
    openPlayer(state.playlist.items[state.playlistIndex].id, false, true);
  } else {
    state.playlistActive = false;
    state.playlist = null;
    showToast("🎉 סיימת את הפלייליסט!");
    setScreen("home");
  }
}

function renderPlayer(){
  if(!state.player) return "";
  const item = state.player;
  const color = CATEGORY_COLORS[item.category] || "#888";
  return `
  <div class="overlay" onclick="if(event.target===this) closePlayer()">
    <div class="player-sheet">
      ${state.playerIsSurprise ? `<div class="hero-eyebrow" style="margin-bottom:10px;">🎲 הפתעה בשבילך</div>` : ''}
      <div class="player-art" style="background:linear-gradient(135deg,${color}33,${color}11)">${CATEGORY_ICONS[item.category]||'🎧'}</div>
      <div class="player-title">${item.title}</div>
      <div class="player-meta">${SOURCE_ICONS[item.source]} ${item.source} · ${item.category} · ${fmtDuration(item.duration)}</div>
      <div class="player-progress-track"><div class="player-progress-fill" style="width:${state.playerProgress}%"></div></div>
      <div class="player-times"><span>${Math.round(item.duration*state.playerProgress/100)} דק׳</span><span>${fmtDuration(item.duration)}</span></div>
      <div class="player-controls">
        <button class="player-side-btn" onclick="skipInPlayer()">⏭️</button>
        <button class="player-play-btn" onclick="togglePlay()">${state.playerPlaying ? '⏸️' : '▶️'}</button>
        <a class="player-side-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;" href="${item.url}" target="_blank" title="פתח תוכן מקורי">↗️</a>
      </div>
      <div class="player-actions">
        <button class="btn-icon ${item.userRating==='liked'?'liked':''}" style="flex:1;border-radius:100px;" onclick="rateItem(${item.id},'liked'); renderPlayerOnly();">❤️ מעניין אותי</button>
        <button class="btn-icon ${item.userRating==='disliked'?'disliked':''}" style="flex:1;border-radius:100px;" onclick="rateItem(${item.id},'disliked'); renderPlayerOnly();">👎 פחות</button>
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:12px;" onclick="closePlayer()">סגור</button>
    </div>
  </div>`;
}
function renderPlayerOnly(){
  const holder = document.getElementById("player-holder");
  if(holder) holder.innerHTML = renderPlayer();
}

/* ---------- nav ---------- */
function renderNav(){
  const items = [
    ["home","🏠","Home"], ["new","🆕","חדש"], ["foryou","🎯","בשבילי"],
    ["history","🎧","היסטוריה"], ["settings","⚙️","הגדרות"]
  ];
  const newCount = RecommendationEngine.whatsNew().length;
  return `
  <div class="navbar">
    ${items.map(([id,emoji,label]) => `
      <button class="nav-btn ${state.screen===id?'active':''}" onclick="setScreen('${id}')">
        <span class="nav-emoji">${emoji}</span><span>${label}</span>
        ${id==='new' && newCount>0 ? `<span class="nav-badge">${newCount}</span>` : ''}
      </button>
    `).join("")}
  </div>`;
}

/* ---------- root render ---------- */
function render(){
  let body = "";
  if(state.screen==="home") body = renderHome();
  else if(state.screen==="new") body = renderNew();
  else if(state.screen==="foryou") body = renderForYou();
  else if(state.screen==="history") body = renderHistory();
  else if(state.screen==="settings") body = renderSettings();

  const skyBg = state.screen==="home" ? renderSkyBg() : "";

  document.getElementById("app").innerHTML = `
    ${skyBg}
    <div class="page-content">
      <div class="topbar">
        <div>
          <div class="brand"><span class="dot"></span>ListenNow</div>
          <div class="brand-sub ${state.screen==='home' ? 'hero-chip' : ''}">${state.headline}</div>
        </div>
      </div>
      ${body}
    </div>
    ${renderNav()}
    ${state.toast ? `<div class="toast">${state.toast}</div>` : ''}
    <div id="player-holder">${renderPlayer()}</div>
  `;
}

render();
// Instant first paint uses local fallback data (above); now try to
// upgrade to the real ContentSources backend in the background.
loadRemoteCatalog();
</script>
